<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <meta name='description' content='Meu primeiro site'>
  <title>site novo</title>
  <style>
    :root { --bg:#f0f4f8; --accent:#0b74de; --text:#222; }
    html, body { height:100%; margin:0; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background: linear-gradient(135deg,#eef6ff,var(--bg)); color: var(--text); display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; padding: 2rem; border-radius: 12px; box-shadow: 0 6px 20px rgba(11,116,222,0.08); background: rgba(255,255,255,0.8); max-width: 720px; margin: 2rem; }
    h1 { margin: 0 0 0.5rem; color: var(--accent); font-size: 2rem; }
    p { margin: 0; font-size: 1.125rem; opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <h1>site novo</h1>
    <p>meu primeiro site</p>
  </div>
</body>
</html>
